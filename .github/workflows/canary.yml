name: canary

# The extension reads other people's pages. They change without warning, and
# the failure mode is silent — subtitles simply stop appearing. These run daily
# so a break is discovered by CI rather than mid-episode.
#
# One job checks every site. The contract tests read what each site serves
# without a login (YouTube, Netflix, Disney+, Prime Video, HBO Max, Apple TV, Viki, and
# the dictionary and audio hosts). The browser check then loads the built
# extension on a YouTube video and waits for the overlay to draw words: the
# injection and the tokenizer, which the contract tests only approximate.
# Netflix, Disney+, Prime Video, HBO Max, Apple TV and Viki have no browser check; they
# need a signed-in account, a paid one on all but Viki.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# The repository's default token is read-only; opening the issue needs more.
permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    # A day's run takes two or three minutes. GitHub's own limit is six
    # hours, which a hung browser check reached every day from 11 October
    # until the month's Actions minutes were gone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `shell: bash` is not the default it looks like: named explicitly, it
      # runs with -o pipefail, so a failing test fails the step instead of
      # `tee` reporting success. Without it this canary was red inside and
      # green outside for a month.
      - name: Check live-site assumptions
        id: contract
        shell: bash
        run: pnpm test:contract 2>&1 | tee canary.log
        continue-on-error: true

      - run: pnpm build

      - name: Install Chrome for Testing and a display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm exec playwright-core install --with-deps chromium

      # Exit 2 is "inconclusive": YouTube served a bot check in place of the
      # video, which says nothing about the extension, so it passes with a
      # warning. A failure is tried three times before it counts. The script
      # gives up after five minutes; a try still running at six is stopped,
      # and counts as a failure (timeout's 124, or 137 once it is killed).
      # Past 20 minutes the step itself is stopped: a step's timeout, unlike
      # the job's, still lets the steps below keep the logs and file the issue.
      - name: Load the extension on a YouTube video
        id: smoke
        shell: bash
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            echo "--- attempt $attempt" | tee -a smoke.log
            set +e
            timeout --kill-after=30s 6m xvfb-run -a node scripts/smoke-youtube.mjs 2>&1 | tee -a smoke.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" = 124 ] || [ "$code" = 137 ]; then
              echo "FAIL: the attempt was stopped after six minutes" | tee -a smoke.log
              code=1
            fi
            [ "$code" != 1 ] && break
          done
          if [ "$code" = 2 ]; then echo "::warning::YouTube browser check was inconclusive"; fi
          [ "$code" != 1 ]
        continue-on-error: true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-log
          path: |
            canary.log
            smoke.log
          if-no-files-found: ignore

      - name: Open or update an issue when an assumption breaks
        if: steps.contract.outcome == 'failure' || steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="canary: a live-site assumption broke"
          # The logs are coloured for this page, and an issue shows the colour
          # codes as text ([90m, [2m). They are taken out, and so are the
          # ::error and ::warning lines, which repeat what the log says. Of the
          # contract tests, what failed is posted, not the log's last lines.
          ESC=$(printf '\033')
          clean() { sed "s/${ESC}\[[0-9;]*[A-Za-z]//g" "$1" 2>/dev/null | grep -v '^::' | uniq; }
          FAILED=$(clean canary.log | sed -n '/Failed Tests/,$p' | head -80)
          [ -n "$FAILED" ] || FAILED=$(clean canary.log | tail -60)
          BODY=$(printf 'The daily canary failed. A site likely changed shape.\n\nContract tests: %s. Browser check: %s.\n\nRun: %s\n\n```\n%s\n```\n\n```\n%s\n```\n' \
            "${{ steps.contract.outcome }}" "${{ steps.smoke.outcome }}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$FAILED" "$(clean smoke.log | tail -15)")
          # The label is how the open issue is found again; make sure it exists.
          gh label create canary --color B60205 \
            --description "The daily canary found a broken site assumption" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label canary --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label canary
          fi

      # A day when everything passes closes the issue, so an open one is always
      # a break still unmended. An inconclusive check counts as passing here, as
      # it does above; if the break comes back, the next red run opens a new one.
      - name: Close the issue once every check passes
        if: steps.contract.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label canary --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Every check passed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Fail the job so the run is red
        if: steps.contract.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: exit 1
