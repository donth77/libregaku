<!doctype html>
<meta charset="utf-8">
<title>Libregaku</title>
<link rel="stylesheet" href="action.css">
<main>
  <header>
    <span class="brand">Libregaku</span>
    <span class="links">
      <a id="openHelp" href="help.html" target="_blank">Help</a>
      <button type="button" id="openSettings" title="All settings">Settings</button>
    </span>
  </header>

  <p id="status" class="status">Checking this page…</p>

  <section id="tracks" hidden>
    <div class="row">
      <label for="track">Subtitles</label>
      <select id="track"></select>
    </div>
    <div class="row">
      <label for="second">Translation</label>
      <select id="second"></select>
    </div>
  </section>

  <section id="capture" hidden>
    <p id="captureText" class="fine"></p>
    <button type="button" id="captureGo" hidden></button>
  </section>

  <section id="quick" hidden>
    <button type="button" id="toggleSidebar">Toggle Sidebar</button>
  </section>

  <footer id="anki">Anki: checking…</footer>
</main>
<script type="module" src="action.js"></script>
